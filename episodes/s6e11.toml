comp = "playground-series-s6e11"
decimals = ["amount_usd", "hours_since_last_txn", "distance_from_home_km",
            "account_balance_usd", "velocity_score", "merchant_risk_score"]
stack = ["lgbm_glm", "lgbm_te", "realmlp"]

# 3-leaf params from Optuna study s6e11-te-digits, CV 0.95025; shared by every [models.*] unless overridden
[params]
n_estimators = 20000
learning_rate = 0.02
num_leaves = 3
min_child_samples = 22
reg_lambda = 0.004437465914755934
reg_alpha = 0.0011263417507507264
colsample_bytree = 0.808393244512384
subsample = 0.9641801257754312
subsample_freq = 1
verbose = -1

[models.lgbm_te]
keys = "digits"  # none | values | digits

[models.lgbm_glm]
keys = "digits"
glm = true

[kernels.realmlp]
script = "kaggle/realmlp/realmlp.py"
gpu_minutes = 45

[kernels.realmlp.features]
decimals = ["amount_usd", "hours_since_last_txn", "velocity_score", "distance_from_home_km"]
combos = [["merchant_category", "card_type", "txn_count_last_24h"], ["merchant_category", "customer_age"]]
bins = {merchant_risk_score = [7], hours_since_last_txn = [500, 1000]}
te = ["hours_since_last_txn"]
